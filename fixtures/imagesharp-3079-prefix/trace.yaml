fix_commit: 89face0b8930068f43db1064a0c00e2170993549
fix_pr: https://github.com/SixLabors/ImageSharp/pull/3081
description: PNG iTXt chunk decoder before the fix — attacker-crafted truncated
             iTXt chunks reach data[zeroIndexKeyword+1] or
             data.Slice(translatedKeywordStartIdx, translatedKeywordLength)
             with attacker-controlled indices/lengths, causing
             IndexOutOfRangeException or ArgumentOutOfRangeException.

