vuln_id: parquet-dotnet-738
fix_commit: ""
fix_pr: https://github.com/aloneguid/parquet-dotnet/issues/738
description: >
  parquet-dotnet's Apache-Thrift compact-protocol reader allocates a
  byte[length] sized by an attacker-controlled VarInt32 length prefix without
  bounding it. ReadBinary reads a VarInt32 from the input stream, then calls
  Stream.ReadBytesExactly(length) which immediately allocates new byte[length].
  A crafted Parquet file specifying a huge length can drive the process to
  OutOfMemoryException (denial-of-service).

