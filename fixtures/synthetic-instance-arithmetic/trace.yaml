vuln_id: synthetic-instance-arithmetic
fix_commit: ""
fix_pr: ""
description: >
  Regression fixture for the instance-sizer arithmetic-attribution gap (N3).
  WireDecoder.Decode reads two u16 fields from a stream via ReadU16(), passes
  them to InstanceSizer's constructor (which stores them in this-fields _count
  and _stride), then calls sizer.TotalBytes() to compute (int)_count * (int)_stride.
  Without N3, the walk of TotalBytes sees no tainted inputs (bitmask=0, seedFields=[]
  because the receiver is a local, not caller's `this`), so the `*` instruction
  never emits an arithmetic hop — only an identity call-boundary hop appears.
  With N3, primitive this-fields (_count, _stride) are seeded, enabling hop 8:
  arithmetic at TotalBytes:47 with tainted_value_out=_count*_stride.

