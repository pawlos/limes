description: >
  Synthetic regression fixture for milestone-T2 Phase 1: $"..." interpolation
  flowing into IDbCommand.CommandText. SearchService.Search interpolates a
  tainted regConfig parameter via DefaultInterpolatedStringHandler.AppendFormatted
  (forced to handler emission via 5-part interpolation) into a SQL fragment,
  then assigns to System.Data.Common.DbCommand.CommandText. The sink hop has
  kind: sql_injection, api: sql_command_text. Tainted-value provenance reads
  `InterpolatedString(regConfig).ToStringAndClear`, proving the T2 walker
  primitive (TryHandleInterpolatedStringAppend) fired on the AppendFormatted
  call and ToStringAndClear's byref-receiver over-approximation propagated to
  the return value. Locked at milestone-T2 Phase 1; do not regenerate without
  re-locking.
