vuln_id: nbmp-2cwq-pwfr-wcw3-prefix
advisory: GHSA-2cwq-pwfr-wcw3
fix_commit: 7d1eb319cfabe7280e70699946c9a48579fa2f30
fix_pr: https://github.com/AArnott/Nerdbank.MessagePack/pull/941
description: >
  Pre-fix Nerdbank.MessagePack 1.1.25: MessagePackPrimitives.TryRead assigns
  tokenSize = checked((int)header.Length) before validating that header.Length
  is a legal timestamp extension size. When the buffer is incomplete the caller
  (MessagePackStreamingReader.TryRead) passes tokenSize directly to
  stackalloc — attacker-controlled length causes StackOverflowException.
  Fixed in 1.1.62 by validating the length before the assignment.

