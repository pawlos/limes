vuln_id: sqli-regex-guard-prefix
fix_commit: ""
fix_pr: ""
description: >
  Synthetic regression fixture for milestone-T3 Phase 1: tainted this-field
  flowing through a regex-guarded $"..." interpolation into Weasel.Postgresql
  .ICommandBuilder::AppendWithParameters. GuardedSearchFragment.Apply has an
  inline `if (!_pattern.IsMatch(_regConfig)) throw` before the sink-reaching
  code. The T3 sanitizer recognizer (MatchRegexIsMatchAndThrow) fires on this
  IL shape, emits a sanitizer hop with relation: regex_match, and suppresses
  `sanitizer_absence` via the in-method-propagator chain extension (the
  ldfld _regConfig propagator brings the field name into the sink's value
  chain so the sanitizer hop's target matches). Sink still fires (the IL
  still reaches AppendWithParameters), but the trace shows the sanitizer
  protection. Compare to fixtures/sqli-command-builder-prefix (T2.1 - same
  shape MINUS the guard, fires sanitizer_absence). Locked at milestone-T3
  Phase 1; do not regenerate without re-locking.
